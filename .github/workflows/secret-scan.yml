name: Secret scan (full history)

# Weekly full-history scan. The per-push scan in ci.yml only looks at new
# commits; new Trufflehog detectors can still find old secrets.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit on every branch

      # On schedule/workflow_dispatch the action scans the entire history.
      # trufflehog-exclude.txt skips only tests/db/test_service.py: an old commit (624f699) has a dummy
      # Postgres URL (user u, password p, host h) that failed every run from 2026-10-18. The per-push scan
      # in ci.yml still checks that file. The owner approved this one exclusion on 2026-11-21; add nothing
      # else without asking.
      - name: Trufflehog (entire history)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          # Pinned like the `uses:` tag; Dependabot bumps the tag but not this input.
          version: 3.97.9
          extra_args: --results=verified,unknown,unverified --exclude-paths=.github/trufflehog-exclude.txt
